<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rhythm Train. — 4/4拍節奏列車 3D點名系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Playfair Display, JetBrains Mono, Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    :root {
      --bg-center: #faf7f2;
      --bg-edge: #e4dfd5;
      --ink: #18181b;
      --muted: #57534e;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 44% 40%, var(--bg-center) 0%, #efeae0 58%, var(--bg-edge) 100%);
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      touch-action: none;
    }

    .serif-title {
      font-family: 'Playfair Display', 'Instrument Serif', Georgia, serif;
    }

    .mono-label {
      font-family: 'JetBrains Mono', monospace;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      touch-action: none;
    }

    /* Prevent hidden HUD & Banner from intercepting pointer events */
    #playback-minimal-hud.is-hidden,
    #playback-minimal-hud.is-hidden *,
    #center-banner.is-hidden,
    #center-banner.is-hidden * {
      pointer-events: none !important;
    }

    /* Editorial Glass Card inspired by Reference Image 2 */
    .control-card {
      background: rgba(255, 254, 251, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow:
        0 24px 48px -12px rgba(28, 25, 23, 0.14),
        0 4px 14px rgba(28, 25, 23, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 1);
    }

    .cam-btn-active {
      background-color: #18181b !important;
      color: #ffffff !important;
      border-color: #18181b !important;
    }

    /* Soft ambient flavor glow inside control card */
    .flavor-aura {
      position: absolute;
      top: 10px;
      right: 24px;
      width: 120px;
      height: 120px;
      border-radius: 9999px;
      filter: blur(36px);
      opacity: 0.30;
      pointer-events: none;
      transition: background-color 0.35s ease;
    }

    /* High-Contrast Glossy 3D Gummy Flavor Orbs */
    .flavor-orb {
      position: relative;
      width: 38px;
      height: 38px;
      border-radius: 9999px;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      box-shadow:
        0 6px 12px -2px rgba(0, 0, 0, 0.28),
        inset 0 -4px 6px rgba(0, 0, 0, 0.32),
        inset 0 3px 5px rgba(255, 255, 255, 0.8);
    }
    .flavor-orb::after {
      content: '';
      position: absolute;
      top: 5px;
      left: 8px;
      width: 12px;
      height: 6px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.88);
      transform: rotate(-22deg);
    }
    .flavor-orb:hover {
      transform: scale(1.12);
    }
    .flavor-orb.active {
      transform: scale(1.15);
      outline: 3px solid #18181b;
      outline-offset: 3px;
    }

    /* Custom Minimalist Slider */
    input[type="range"].editorial-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      background: #dcd8ce;
      border-radius: 999px;
      outline: none;
    }
    input[type="range"].editorial-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #18181b;
      border: 2.5px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    input[type="range"].editorial-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Stat Sub-box */
    .stat-box {
      background: rgba(244, 241, 234, 0.92);
      border: 1px solid rgba(214, 211, 203, 0.9);
      border-radius: 14px;
      position: relative;
      overflow: hidden;
    }

    /* Floating 3D HTML Labels */
    .world-label {
      position: absolute;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: opacity 0.2s ease;
      z-index: 5;
    }

    /* Roll Call Pop Badge */
    @keyframes floatPop {
      0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
      20% { transform: translate(-50%, -16px) scale(1.15); opacity: 1; }
      80% { transform: translate(-50%, -32px) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -44px) scale(0.85); opacity: 0; }
    }
    .rollcall-pop {
      position: absolute;
      pointer-events: none;
      z-index: 35;
      animation: floatPop 0.78s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Score Beat Cell with Subtle Musical Staff Lines */
    .beat-cell {
      position: relative;
      overflow: hidden;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 9px,
        rgba(120, 113, 108, 0.07) 9px,
        rgba(120, 113, 108, 0.07) 10px
      );
      transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .beat-cell.downbeat-cell {
      box-shadow: inset 0 2px 0 rgba(24, 24, 27, 0.14);
    }
    .beat-cell.playing {
      transform: translateY(-4px) scale(1.06);
      background-color: #18181b !important;
      color: #ffffff !important;
      box-shadow: 0 10px 22px -4px rgba(24, 24, 27, 0.4);
    }
    .beat-cell.playing .beat-subtext {
      color: #fde047 !important;
    }
    .pitch-glyph {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Pulse animation for Depart button when ready */
    @keyframes pulseAmber {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.6); }
      50% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
    }
    .depart-ready {
      animation: pulseAmber 1.6s infinite;
    }

    /* Auto-hide UI panels smoothly during Roll Call playback or Clean 3D Mode */
    .ui-panel {
      transition: opacity 0.38s cubic-bezier(0.22, 1, 0.36, 1), transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }
    body.is-playing-rollcall .ui-panel,
    body.clean-3d-mode .collapsible-ui {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translateY(10px) scale(0.96);
    }
    body.is-playing-rollcall aside.ui-panel,
    body.clean-3d-mode aside.collapsible-ui {
      transform: translate(20px, -50%) scale(0.96);
    }
    @media (max-width: 767px) {
      body.is-playing-rollcall aside.ui-panel,
      body.clean-3d-mode aside.collapsible-ui {
        transform: translateY(-16px) scale(0.96);
      }
    }

    /* Minimal Floating HUD shown ONLY during Roll Call playback */
    #playback-minimal-hud {
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
  </style>
</head>
<body>

  <!-- 3D Viewport Container -->
  <div id="canvas-container"></div>

  <!-- Dynamic 3D World Overlay Labels -->
  <div id="world-labels" class="fixed inset-0 pointer-events-none z-10 overflow-hidden"></div>

  <!-- MINIMAL FLOATING HUD DURING ROLL-CALL PLAYBACK (Appears when toolbars hide) -->
  <div id="playback-minimal-hud" class="is-hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 -translate-y-4">
    <div class="control-card px-4 py-1.5 rounded-full flex items-center gap-3.5 shadow-2xl border-2 border-stone-900/15">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-rose-600 animate-ping"></span>
        <span id="hud-carriage-label" class="mono-label text-xs font-black text-stone-800">第一節車廂</span>
        <span id="hud-beat-badge" class="serif-title italic text-lg font-bold text-rose-600 px-2 py-0.5 rounded-lg bg-rose-50 border border-rose-200">1/4</span>
      </div>
      <div class="w-24 sm:w-28 h-2 bg-stone-200 rounded-full overflow-hidden">
        <div id="hud-progress-bar" class="h-full bg-rose-600 transition-all duration-100" style="width: 0%;"></div>
      </div>
      <button id="btn-hud-stop" type="button" class="px-3 py-1 rounded-full bg-rose-600 hover:bg-rose-700 active:scale-95 text-white font-bold text-xs shadow-md transition cursor-pointer flex items-center gap-1">
        <span>⏹</span> 停止點名
      </button>
    </div>
  </div>

  <!-- CELEBRATORY ROLL-CALL COMPLETE / TRAIN DEPARTED BANNER (Centered in viewport) -->
  <div id="center-banner" class="is-hidden fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 pointer-events-none opacity-0 scale-95 transition-all duration-300 w-max max-w-[92vw]">
    <div class="control-card px-5 py-3 rounded-full flex items-center gap-3.5 shadow-2xl border-2 border-amber-400">
      <span id="banner-icon" class="text-2xl">🎉</span>
      <div>
        <div id="banner-title" class="text-xs sm:text-sm font-black text-stone-900">點名完成！全員準備就緒！</div>
        <div id="banner-desc" class="text-[10px] sm:text-xs text-stone-600">點擊右側或下方按鈕讓列車鳴笛出發！</div>
      </div>
      <button id="banner-action-btn" type="button" class="ml-1 px-4 py-2 rounded-full bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-bold text-xs shadow-md transition cursor-pointer whitespace-nowrap">
        🚂 列車出發！
      </button>
    </div>
  </div>

  <!-- COMPACT TOP-LEFT BAR -->
  <header class="ui-panel fixed top-3 left-4 z-40 flex flex-wrap items-center gap-2.5 pointer-events-none">
    <div class="control-card px-3.5 py-1.5 rounded-full flex items-center gap-2.5 shadow-sm pointer-events-auto">
      <span id="status-dot" class="w-2 h-2 rounded-full bg-red-600 animate-pulse shadow-[0_0_8px_#dc2626]"></span>
      <h1 class="serif-title text-lg sm:text-xl leading-none tracking-tight text-stone-900">
        <span class="italic font-normal">Rhythm</span><span class="text-stone-400 font-light mx-0.5">/</span><span class="font-bold">Train.</span>
      </h1>
      <span id="status-label" class="hidden sm:inline mono-label text-[9px] tracking-[0.12em] uppercase text-stone-500 font-bold border-l border-stone-300 pl-2">
        4/4 ROLL CALL
      </span>
    </div>

    <!-- Camera & Clean UI Quick Buttons -->
    <div class="flex items-center gap-1.5 pointer-events-auto">
      <button id="btn-reset-cam" type="button" class="cam-btn-active px-2.5 py-1.5 rounded-full bg-white/90 hover:bg-white text-[11px] font-bold text-stone-800 shadow-sm border border-stone-300/80 transition flex items-center gap-1 cursor-pointer active:scale-95">
        <span>🎥</span> 標準視角
      </button>
      <button id="btn-top-cam" type="button" class="px-2.5 py-1.5 rounded-full bg-white/90 hover:bg-white text-[11px] font-bold text-stone-800 shadow-sm border border-stone-300/80 transition flex items-center gap-1 cursor-pointer active:scale-95">
        <span>🔍</span> 俯視座位
      </button>
      <button id="btn-toggle-ui" type="button" class="px-2.5 py-1.5 rounded-full bg-stone-900/90 hover:bg-stone-900 text-[11px] font-bold text-white shadow-sm transition flex items-center gap-1 cursor-pointer active:scale-95" title="隱藏或展開周邊面板，讓3D畫面更大">
        <span>👁️</span> <span id="toggle-ui-text">收合面板</span>
      </button>
    </div>
  </header>

  <!-- SLIM RIGHT FLOATING CONTROL CARD -->
  <aside class="ui-panel collapsible-ui fixed top-14 right-3 md:top-1/2 md:-translate-y-1/2 md:right-4 z-30 w-[246px] sm:w-[262px] control-card rounded-[22px] p-3 sm:p-3.5">
    <div id="flavor-aura" class="flavor-aura" style="background-color: #E60026; width: 90px; height: 90px;"></div>

    <div class="relative z-10 space-y-2.5">
      <!-- 0. TIME SIGNATURE SELECTOR (4/4 vs 3/4) -->
      <div>
        <div class="flex items-center justify-between mb-1">
          <span class="mono-label text-[9px] tracking-[0.12em] uppercase text-stone-500 font-bold">TIME SIGNATURE · 拍號</span>
          <span id="meter-badge" class="text-[10px] font-black text-rose-600">每節 4 排 (4拍)</span>
        </div>
        <div class="grid grid-cols-2 gap-1.5 bg-stone-200/80 p-1 rounded-xl">
          <button id="btn-meter-44" type="button" class="py-1 px-2 rounded-lg bg-stone-900 text-white font-black text-[11px] shadow-sm transition cursor-pointer flex items-center justify-center gap-1">
            <span class="serif-title italic text-xs">4/4</span>
            <span>四四拍</span>
          </button>
          <button id="btn-meter-34" type="button" class="py-1 px-2 rounded-lg text-stone-700 hover:text-stone-900 font-black text-[11px] transition cursor-pointer flex items-center justify-center gap-1">
            <span class="serif-title italic text-xs">3/4</span>
            <span>三四拍</span>
          </button>
        </div>
      </div>

      <!-- 1. HIGH-CONTRAST FLAVOR / PITCH ORBS -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <span class="mono-label text-[9px] tracking-[0.12em] uppercase text-stone-500 font-bold">FLAVOR · 音高色彩</span>
          <span id="flavor-name" class="text-[11px] font-black text-stone-900">櫻桃紅 (Do · C5)</span>
        </div>
        <div class="flex items-center justify-between px-0.5" id="flavor-list">
          <button data-flavor="0" type="button" class="flavor-orb active" style="width:32px;height:32px;background: radial-gradient(circle at 35% 30%, #ff3b5c, #b8001f);" title="櫻桃紅 - Do (C5)"></button>
          <button data-flavor="1" type="button" class="flavor-orb" style="width:32px;height:32px;background: radial-gradient(circle at 35% 30%, #ff7b33, #cc4400);" title="柑橘橙 - Re (D5)"></button>
          <button data-flavor="2" type="button" class="flavor-orb" style="width:32px;height:32px;background: radial-gradient(circle at 35% 30%, #ffd000, #c48600);" title="檸檬黃 - Mi (E5)"></button>
          <button data-flavor="3" type="button" class="flavor-orb" style="width:32px;height:32px;background: radial-gradient(circle at 35% 30%, #10e056, #007a29);" title="青蘋綠 - Sol (G5)"></button>
          <button data-flavor="4" type="button" class="flavor-orb" style="width:32px;height:32px;background: radial-gradient(circle at 35% 30%, #b44ce0, #581275);" title="藍莓紫 - La (A5)"></button>
        </div>
      </div>

      <!-- 2. PASSENGER TYPE SELECTOR (Adult ♩, Child ♪, Quadruplets ♬×4) -->
      <div>
        <div class="flex items-center justify-between mb-1">
          <span class="mono-label text-[9px] tracking-[0.12em] uppercase text-stone-500 font-bold">PASSENGER · 點座位或拖曳</span>
          <span id="stat-subtext" class="text-[9px] font-bold text-stone-500">大人0·小孩0·四胞胎0</span>
        </div>
        <div class="grid grid-cols-3 gap-1">
          <button id="select-adult" type="button" class="group flex flex-col items-center p-1.5 rounded-xl border-2 border-stone-900 bg-stone-900 text-white transition text-center cursor-pointer">
            <div class="w-6 h-6 rounded-lg bg-white/20 flex items-center justify-center text-sm font-black mb-0.5">♩</div>
            <div class="text-[10px] font-black leading-tight">大人(1拍)</div>
          </button>
          <button id="select-child" type="button" class="group flex flex-col items-center p-1.5 rounded-xl border-2 border-stone-300 bg-white hover:bg-stone-50 text-stone-800 transition text-center cursor-pointer">
            <div class="w-6 h-6 rounded-lg bg-stone-200 flex items-center justify-center text-sm font-black text-stone-900 mb-0.5">♪</div>
            <div class="text-[10px] font-black leading-tight">小孩(半拍)</div>
          </button>
          <button id="select-sixteenth" type="button" class="group flex flex-col items-center p-1.5 rounded-xl border-2 border-stone-300 bg-white hover:bg-stone-50 text-stone-800 transition text-center cursor-pointer">
            <div class="w-6 h-6 rounded-lg bg-stone-200 flex items-center justify-center text-stone-900 mb-0.5 px-0.5">
              <svg viewBox="0 0 76 44" class="w-5 h-3.5" fill="currentColor" aria-hidden="true">
                <rect x="12" y="5" width="57" height="4.8" rx="1.5" />
                <rect x="12" y="13" width="57" height="4.8" rx="1.5" />
                <rect x="12" y="6" width="3.4" height="27" />
                <rect x="30" y="6" width="3.4" height="27" />
                <rect x="48" y="6" width="3.4" height="27" />
                <rect x="65.6" y="6" width="3.4" height="27" />
                <ellipse cx="8.5" cy="33.5" rx="6.2" ry="4.6" transform="rotate(-18 8.5 33.5)" />
                <ellipse cx="26.5" cy="33.5" rx="6.2" ry="4.6" transform="rotate(-18 26.5 33.5)" />
                <ellipse cx="44.5" cy="33.5" rx="6.2" ry="4.6" transform="rotate(-18 44.5 33.5)" />
                <ellipse cx="62.5" cy="33.5" rx="6.2" ry="4.6" transform="rotate(-18 62.5 33.5)" />
              </svg>
            </div>
            <div class="text-[10px] font-black leading-tight">四胞胎</div>
          </button>
        </div>
      </div>

      <!-- 3. SIDE-BY-SIDE COMPACT WOBBLE & TEMPO SLIDERS -->
      <div class="grid grid-cols-2 gap-2 pt-0.5">
        <div class="bg-stone-100/80 px-2 py-1.5 rounded-xl border border-stone-200/80">
          <div class="flex justify-between items-center mb-1">
            <span class="mono-label text-[9px] uppercase text-stone-500 font-bold">Q彈度</span>
            <span id="wobble-val" class="mono-label text-[10px] font-bold text-stone-900">85%</span>
          </div>
          <input id="slider-wobble" type="range" min="15" max="100" value="85" class="editorial-slider" />
        </div>

        <div class="bg-stone-100/80 px-2 py-1.5 rounded-xl border border-stone-200/80">
          <div class="flex justify-between items-center mb-1">
            <span class="mono-label text-[9px] uppercase text-stone-500 font-bold">速度</span>
            <span id="tempo-val" class="mono-label text-[10px] font-bold text-stone-900">92</span>
          </div>
          <input id="slider-tempo" type="range" min="56" max="140" value="92" class="editorial-slider" />
        </div>
      </div>

      <!-- Hidden compatibility nodes for JS updates -->
      <div class="hidden">
        <span id="stat-beat">4/4</span>
        <div id="beat-progress-bar"></div>
        <span id="stat-passengers">0</span>
      </div>

      <!-- 4. PRIMARY PLAY ROLL CALL + TRAIN DEPART BUTTONS -->
      <div class="space-y-1.5 pt-0.5">
        <button id="btn-play" type="button" class="w-full py-2.5 px-3.5 rounded-xl bg-[#18181b] hover:bg-stone-800 active:scale-[0.99] text-white font-bold text-xs flex items-center justify-between shadow-md shadow-stone-900/15 transition cursor-pointer">
          <span class="flex items-center gap-1.5">
            <span id="play-icon" class="w-4 h-4 rounded-full bg-white/20 flex items-center justify-center text-[10px]">▶</span>
            <span id="play-text">1. 開始點名 (Play)</span>
          </span>
          <span id="play-meter-label" class="serif-title italic text-stone-300 text-sm">4/4</span>
        </button>

        <button id="btn-depart" type="button" class="w-full py-2 px-3.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 active:scale-[0.99] text-white font-bold text-xs flex items-center justify-between shadow-md shadow-amber-500/20 transition cursor-pointer">
          <span class="flex items-center gap-1.5">
            <span id="depart-icon" class="w-4 h-4 rounded-full bg-white/25 flex items-center justify-center text-[11px]">🚂</span>
            <span id="depart-text">2. 列車出發 (Depart)</span>
          </span>
          <span class="mono-label text-[10px] bg-white/20 px-1.5 py-0.5 rounded-full">GO!</span>
        </button>
      </div>

      <!-- 5. SECONDARY ACTION ROW -->
      <div class="grid grid-cols-2 gap-1.5">
        <button id="btn-random" type="button" class="py-1.5 px-2 rounded-lg bg-stone-200/90 hover:bg-stone-300/80 text-stone-800 text-[11px] font-bold transition flex items-center justify-center gap-1 cursor-pointer">
          <span>🎲</span> 隨機示範
        </button>
        <button id="btn-clear" type="button" class="py-1.5 px-2 rounded-lg bg-stone-200/90 hover:bg-rose-100 hover:text-rose-700 text-stone-800 text-[11px] font-bold transition flex items-center justify-center gap-1 cursor-pointer">
          <span>↺</span> 清空座位
        </button>
      </div>
    </div>
  </aside>

  <!-- SLEEK DOCKED BOTTOM LIVE RHYTHM SCORE BAR -->
  <div id="score-dock-wrapper" class="ui-panel collapsible-ui fixed bottom-2.5 left-1/2 -translate-x-1/2 md:left-4 md:translate-x-0 md:right-[282px] z-20 w-[95vw] md:w-auto max-w-[820px] transition-all duration-300">
    <div class="control-card rounded-[18px] px-3 py-2 border border-white/95 shadow-lg">
      <div class="flex items-center justify-between gap-2 mb-1.5">

  <script>
    /********************************************************************
     * 1. HIGH-CONTRAST FLAVORS, MUSICAL PITCHES & STATE CONFIGURATION
     ********************************************************************/
    const FLAVORS = [
      {
        id: 0,
        name: '櫻桃紅 (Do · C5)',
        short: 'Do',
        color: '#E60026',      // Vivid Cherry Red
        emissive: '#59000E',
        freq: 523.25           // C5
      },
      {
        id: 1,
        name: '柑橘橙 (Re · D5)',
        short: 'Re',
        color: '#FF5500',      // Vibrant Tangerine Orange
        emissive: '#662200',
        freq: 587.33           // D5
      },
      {
        id: 2,
        name: '檸檬黃 (Mi · E5)',
        short: 'Mi',
        color: '#F2A900',      // Rich Sunny Gold
        emissive: '#5E4000',
        freq: 659.25           // E5
      },
      {
        id: 3,
        name: '青蘋綠 (Sol · G5)',
        short: 'Sol',
        color: '#00A838',      // Deep Emerald Green
        emissive: '#004215',
        freq: 783.99           // G5
      },
      {
        id: 4,
        name: '藍莓紫 (La · A5)',
        short: 'La',
        color: '#7B1FA2',      // Rich Berry Purple
        emissive: '#310B42',
        freq: 880.00           // A5
      }
    ];

    const state = {
      beatsPerBar: 4,                // 4 for 4/4 time, 3 for 3/4 time
      selectedFlavor: 0,
      selectedPassengerType: 'adult', // 'adult' (♩), 'child' (♪), or 'sixteenth' (♬×4)
      wobbleFactor: 0.85,
      bpm: 92,
      isPlaying: false,
      scoreExpanded: false,
      activeCamPreset: 'reset',
      currentStep: -1,
      stepTimer: null,
      subTimers: [],
      savedCamPos: null,
      savedCamTarget: null,
      departCamActive: false,
      departCamTimer: 0,
      // Train Motion State: 'station' | 'departing' | 'departed' | 'arriving'
      trainPhase: 'station',
      trainX: 0,
      trainVelocity: 0,
      chugTimer: 0,
      carriages: [
        { id: 0, name: '第一節車廂', rows: [] },
        { id: 1, name: '第二節車廂', rows: [] }
      ]
    };

    function initCarriageRowsState(beatsPerBar) {
      for (let c = 0; c < 2; c++) {
        state.carriages[c].rows = [];
        for (let r = 0; r < beatsPerBar; r++) {
          state.carriages[c].rows.push({
            carriageIndex: c,
            rowIndex: r,
            globalBeatIndex: c * beatsPerBar + r,
            mode: 'empty',        // 'empty' | 'adult' | 'children' | 'sixteenth'
            adult: null,
            sixteenth: null,
            seats: [null, null],
            localX: 0,
            seatMeshes: [],
            rowHighlightMesh: null
          });
        }
      }
    }
    initCarriageRowsState(state.beatsPerBar);

    /********************************************************************
     * 2. WEB AUDIO API SYNTHESIZER (Roll Call Voices + 16th Notes + Whistle)
     ********************************************************************/
    let audioCtx = null;

    function ensureAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playPassengerSound(type, flavorIndex, durationSec, subNoteIdx = 0) {
      ensureAudio();
      const now = audioCtx.currentTime;
      const flavor = FLAVORS[flavorIndex] || FLAVORS[0];
      let baseFreq = flavor.freq;
      if (type === 'adult') {
        baseFreq = flavor.freq * 0.5;
      } else if (type === 'sixteenth') {
        baseFreq = flavor.freq * (subNoteIdx % 2 === 1 ? 1.12246 : 1.0);
      }

      const osc = audioCtx.createOscillator();
      const subOsc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = type === 'adult' ? 'triangle' : type === 'sixteenth' ? 'triangle' : 'sine';
      subOsc.type = 'sine';

      osc.frequency.setValueAtTime(baseFreq * 0.92, now);
      osc.frequency.exponentialRampToValueAtTime(baseFreq, now + 0.025);

      subOsc.frequency.setValueAtTime(baseFreq * (type === 'adult' ? 2.0 : 1.5), now);

      const peakGain = type === 'adult' ? 0.38 : type === 'sixteenth' ? 0.28 : 0.30;
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(peakGain, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0008, now + durationSec);

      const subGain = audioCtx.createGain();
      subGain.gain.setValueAtTime(0.10, now);
      subGain.gain.exponentialRampToValueAtTime(0.0005, now + durationSec * 0.65);

      osc.connect(gain);
      subOsc.connect(subGain);
      subGain.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      subOsc.start(now);
      osc.stop(now + durationSec + 0.02);
      osc.stop(now + durationSec + 0.02);
    }

    function playTrainTick(isDownbeat, isCarriageStart) {
      ensureAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      const pitch = isCarriageStart ? 940 : isDownbeat ? 700 : 480;
      osc.frequency.setValueAtTime(pitch, now);
      osc.frequency.exponentialRampToValueAtTime(pitch * 0.45, now + 0.045);

      gain.gain.setValueAtTime(isDownbeat ? 0.11 : 0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.055);
    }

    function playPopSound(freq = 440) {
      ensureAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq * 0.72, now);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.38, now + 0.085);
      gain.gain.setValueAtTime(0.16, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.1);
    }

    function playTrainWhistle() {
      ensureAudio();
      const now = audioCtx.currentTime;

      const playBlast = (startTime, duration) => {
        const freqs = [587.33, 739.99, 880.0];
        freqs.forEach((f, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = idx === 0 ? 'sawtooth' : 'triangle';
          osc.frequency.setValueAtTime(f * 0.97, startTime);
          osc.frequency.exponentialRampToValueAtTime(f, startTime + 0.06);

          const maxG = idx === 0 ? 0.08 : 0.11;
          gain.gain.setValueAtTime(0.001, startTime);
          gain.gain.linearRampToValueAtTime(maxG, startTime + 0.05);
          gain.gain.setValueAtTime(maxG, startTime + duration - 0.08);
          gain.gain.exponentialRampToValueAtTime(0.0008, startTime + duration);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(startTime);
          osc.stop(startTime + duration + 0.02);
        });
      };

      playBlast(now, 0.38);
      playBlast(now + 0.46, 0.65);
    }

    function playSteamChugSound(intensity = 1.0) {
      ensureAudio();
      const now = audioCtx.currentTime;
      const bufferSize = audioCtx.sampleRate * 0.09;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.35));
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(320, now);
      filter.Q.setValueAtTime(1.8, now);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.14 * intensity, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);
    }

    /********************************************************************
     * 3. THREE.JS SCENE, LIGHTING & HIGH-SATURATION GUMMY MATERIALS
     ********************************************************************/
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 140);
    const DEFAULT_CAM_POS = new THREE.Vector3(0.9, 7.8, 13.8);
    const DEFAULT_CAM_TARGET = new THREE.Vector3(0.9, 0.45, 1.05);
    const TOP_CAM_POS = new THREE.Vector3(0.6, 14.2, 4.4);
    const TOP_CAM_TARGET = new THREE.Vector3(0.6, 0.4, 0.6);
    camera.position.copy(DEFAULT_CAM_POS);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.copy(DEFAULT_CAM_TARGET);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.maxPolarAngle = Math.PI / 2 - 0.04;
    controls.minDistance = 7;
    controls.maxDistance = 26;
    controls.update();

    function smootherstep(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * t * (t * (t * 6 - 15) + 10);
    }

    let camTransition = null;
    function setCamButtonsUI(preset) {
      state.activeCamPreset = preset;
      document.getElementById('btn-reset-cam').classList.toggle('cam-btn-active', preset === 'reset');
      document.getElementById('btn-top-cam').classList.toggle('cam-btn-active', preset === 'top');
    }

    function flyCameraTo(targetPos, targetLookAt, presetName = 'free', duration = 0.55) {
      state.departCamActive = false;
      state.savedCamPos = null;
      state.savedCamTarget = null;
      setCamButtonsUI(presetName);
      controls.enableDamping = false;
      camTransition = {
        startPos: camera.position.clone(),
        startLook: controls.target.clone(),
        endPos: targetPos.clone(),
        endLook: targetLookAt.clone(),
        progress: 0,
        duration
      };
    }

    controls.addEventListener('start', () => {
      if (camTransition) {
        camTransition = null;
        controls.enableDamping = true;
      }
      if (state.departCamActive) {
        state.departCamActive = false;
        state.savedCamPos = null;
        state.savedCamTarget = null;
        controls.enableDamping = true;
      }
      setCamButtonsUI('free');
    });

    function createStudioEnvMap() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 256;
      const ctx = c.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, 256);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.5, '#f5f2eb');
      grad.addColorStop(1, '#d6d1c4');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 256);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(50, 20, 160, 60);
      ctx.fillRect(310, 28, 150, 55);
      ctx.fillRect(180, 95, 160, 38);

      const tex = new THREE.CanvasTexture(c);
      tex.mapping = THREE.EquirectangularReflectionMapping;
      tex.encoding = THREE.sRGBEncoding;
      return tex;
    }
    scene.environment = createStudioEnvMap();

    const ambientLight = new THREE.AmbientLight(0xfffdf9, 0.78);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xfffef8, 1.28);
    keyLight.position.set(8, 17, 12);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.camera.near = 2;
    keyLight.shadow.camera.far = 40;
    const d = 13;
    keyLight.shadow.camera.left = -d;
    keyLight.shadow.camera.right = d;
    keyLight.shadow.camera.top = d;
    keyLight.shadow.camera.bottom = -d;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xffe4e6, 0.6);
    rimLight.position.set(-10, 9, -8);
    scene.add(rimLight);

    const floorGeo = new THREE.PlaneGeometry(90, 60);
    const floorMat = new THREE.ShadowMaterial({ opacity: 0.16 });
    const floorMesh = new THREE.Mesh(floorGeo, floorMat);
    floorMesh.rotation.x = -Math.PI / 2;
    floorMesh.position.y = 0;
    floorMesh.receiveShadow = true;
    scene.add(floorMesh);

    function createGummyMaterial(flavorIndex) {
      const f = FLAVORS[flavorIndex] || FLAVORS[0];
      return new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(f.color),
        emissive: new THREE.Color(f.emissive),
        emissiveIntensity: 0.28,
        roughness: 0.13,
        metalness: 0.02,
        clearcoat: 1.0,
        clearcoatRoughness: 0.05,
        reflectivity: 1.0
      });
    }

    /********************************************************************
     * 4. BUILD THE 3D TRAIN, BACKSIDE SCENERY & LOCOMOTIVE
     ********************************************************************/
    const trainGroup = new THREE.Group();
    scene.add(trainGroup);

    const locoWheelMeshes = [];
    const locoConnectingRods = [];
    const carriageWheelMeshes = [];
    const steamParticles = [];
    const noteBurstParticles = [];
    const soundRippleRings = [];
    const backsideTrees = [];
    const backsideLampBulbs = [];
    let signalGreenMat = null;
    let signalRedMat = null;
    let clockMinuteHand = null;

    const woodMat = new THREE.MeshStandardMaterial({ color: 0xcabaa3, roughness: 0.55 });
    const railMat = new THREE.MeshStandardMaterial({ color: 0x78716c, roughness: 0.35, metalness: 0.65 });
    const chassisMat = new THREE.MeshStandardMaterial({ color: 0x1c1917, roughness: 0.35, metalness: 0.3 });
    const locoBodyMat = new THREE.MeshPhysicalMaterial({
      color: 0xdc2626,
      roughness: 0.16,
      clearcoat: 0.9,
      clearcoatRoughness: 0.08
    });
    const creamMat = new THREE.MeshStandardMaterial({ color: 0xfaf8f5, roughness: 0.25 });
    const brassMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.22, metalness: 0.75 });

    function buildRailwayTrack() {
      const trackGroup = new THREE.Group();
      const railGeo = new THREE.BoxGeometry(70, 0.08, 0.11);
      const railBack = new THREE.Mesh(railGeo, railMat);
      railBack.position.set(0, 0.06, -0.78);
      railBack.receiveShadow = true;
      const railFront = new THREE.Mesh(railGeo, railMat);
      railFront.position.set(0, 0.06, 0.78);
      railFront.receiveShadow = true;
      trackGroup.add(railBack, railFront);

      const sleeperGeo = new THREE.BoxGeometry(0.32, 0.05, 2.15);
      for (let x = -34; x <= 34; x += 0.68) {
        const sleeper = new THREE.Mesh(sleeperGeo, woodMat);
        sleeper.position.set(x, 0.025, 0);
        sleeper.receiveShadow = true;
        trackGroup.add(sleeper);
      }
      scene.add(trackGroup);
    }
    buildRailwayTrack();

    // 4.1B Build Back-Side Scenery (Trees, Fence, Signal Post, Bench, Clock & Lamps on the other side of the train)
    const backsideParallaxGroup = new THREE.Group();
    scene.add(backsideParallaxGroup);

    const backsideStationPropsGroup = new THREE.Group();
    scene.add(backsideStationPropsGroup);

    function buildBacksideScenery() {
      // 1. Soft Scenic Turf & Meadow Base Strip behind the tracks (z < -1.35)
      const turfMat = new THREE.MeshStandardMaterial({ color: 0xdbe2d0, roughness: 0.85 });
      const turfStrip = new THREE.Mesh(new THREE.BoxGeometry(36, 0.06, 3.6), turfMat);
      turfStrip.position.set(0.5, 0.03, -3.15);
      turfStrip.receiveShadow = true;
      backsideStationPropsGroup.add(turfStrip);

      const curbMat = new THREE.MeshStandardMaterial({ color: 0xc7c2b8, roughness: 0.65 });
      const curb = new THREE.Mesh(new THREE.BoxGeometry(36, 0.10, 0.16), curbMat);
      curb.position.set(0.5, 0.05, -1.40);
      curb.receiveShadow = true;
      backsideStationPropsGroup.add(curb);

      // 2. Low Wooden Picket / Ranch Fence along the back edge
      const fenceWoodMat = new THREE.MeshStandardMaterial({ color: 0xe7e0d3, roughness: 0.5 });
      const railBarGeo = new THREE.BoxGeometry(19.5, 0.05, 0.04);
      const topRail = new THREE.Mesh(railBarGeo, fenceWoodMat);
      topRail.position.set(0.8, 0.42, -1.58);
      const botRail = new THREE.Mesh(railBarGeo, fenceWoodMat);
      botRail.position.set(0.8, 0.24, -1.58);
      backsideStationPropsGroup.add(topRail, botRail);

      const postGeo = new THREE.BoxGeometry(0.08, 0.52, 0.08);
      for (let fx = -8.8; fx <= 10.4; fx += 1.2) {
        // Leave a gap near the bench & clock
        if (Math.abs(fx - 1.1) < 1.5) continue;
        const post = new THREE.Mesh(postGeo, fenceWoodMat);
        post.position.set(fx, 0.26, -1.58);
        post.castShadow = true;
        post.receiveShadow = true;
        backsideStationPropsGroup.add(post);
      }

      // 3. Vintage Railway Signal Post (Left-Back near Locomotive: x = -4.2, z = -1.65)
      const signalGroup = new THREE.Group();
      signalGroup.position.set(-4.25, 0, -1.68);
      const darkIronMat = new THREE.MeshStandardMaterial({ color: 0x27272a, roughness: 0.35, metalness: 0.6 });

      const sigBase = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.18, 16), darkIronMat);
      sigBase.position.y = 0.09;
      const sigPole = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.07, 2.25, 14), darkIronMat);
      sigPole.position.y = 1.15;
      sigPole.castShadow = true;

      const sigBox = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.58, 0.22), darkIronMat);
      sigBox.position.set(0, 2.05, 0.06);
      sigBox.castShadow = true;

      signalRedMat = new THREE.MeshStandardMaterial({
        color: 0xef4444,
        emissive: 0xdc2626,
        emissiveIntensity: 0.15,
        roughness: 0.2
      });
      signalGreenMat = new THREE.MeshStandardMaterial({
        color: 0x22c55e,
        emissive: 0x16a34a,
        emissiveIntensity: 1.1,
        roughness: 0.2
      });
      const redLens = new THREE.Mesh(new THREE.SphereGeometry(0.075, 14, 14), signalRedMat);
      redLens.position.set(0, 2.18, 0.15);
      const greenLens = new THREE.Mesh(new THREE.SphereGeometry(0.075, 14, 14), signalGreenMat);
      greenLens.position.set(0, 1.92, 0.15);

      // Classic white/red semaphore arm
      const semArm = new THREE.Mesh(
        new THREE.BoxGeometry(0.52, 0.11, 0.04),
        new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.3 })
      );

      rightArm.position.set(-0.03 * s, 0.48 * s, 0.32 * s);

      const eyesGroup = new THREE.Group();

      [-0.085 * s, 0.085 * s].forEach(zEye => {
        const eyeWhite = new THREE.Mesh(new THREE.SphereGeometry(0.055 * s, 10, 10), whiteRimMat);
        eyeWhite.position.set(0, 0, zEye);
        const eyePupil = new THREE.Mesh(new THREE.SphereGeometry(0.036 * s, 10, 10), darkNoteMat);
        eyePupil.position.set(-0.027 * s, 0, zEye);
        eyesGroup.add(eyeWhite, eyePupil);
      });
      figGroup.add(eyesGroup);

      const mouthMesh = new THREE.Mesh(new THREE.SphereGeometry(0.038 * s, 10, 10), darkNoteMat);
      mouthMesh.position.set(-0.265 * s, 0.74 * s, 0);

      const noteHead = new THREE.Mesh(

      );
      noteHead.position.set(0, 0.56, 0);
      noteHead.rotation.z = -0.3;

      };

      return figGroup;
    }

    function createGummyPassengerMesh(type, flavorIndex) {
      const root = new THREE.Group();
      const bodyGroup = new THREE.Group();
      root.add(bodyGroup);

      const gummyMat = createGummyMaterial(flavorIndex);
      const darkNoteMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.15 });
      const whiteRimMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

      if (type === 'sixteenth') {
        const hitbox = new THREE.Mesh(new THREE.BoxGeometry(0.85, 1.25, 1.55), hitboxMat);
        hitbox.position.y = 0.55;
        root.add(hitbox);

        const baseBar = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.08, 1.36), gummyMat);
        baseBar.position.set(0, 0.05, 0);
        baseBar.castShadow = true;
        bodyGroup.add(baseBar);

        const zPositions = [-0.57, -0.19, 0.19, 0.57];
        const miniFigures = [];
        zPositions.forEach((zPos) => {
          const miniFig = buildMiniQuadrupletSubFigure(gummyMat, darkNoteMat, whiteRimMat, zPos);
          bodyGroup.add(miniFig);
          miniFigures.push(miniFig);
        });

        const beam1 = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.045, 1.22), darkNoteMat);
        beam1.position.set(0, 0.83, 0.03);
        const beam2 = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.045, 1.22), darkNoteMat);
        beam2.position.set(0, 0.75, 0.03);
        bodyGroup.add(beam1, beam2);

        root.userData = {
          isPassenger: true,
          type: 'sixteenth',
          flavorIndex,
          gummyMat,
          bodyGroup,
          miniFigures,
          eyesGroup: null,
          mouthMesh: null,
          mouthOpen: 0,
          blinkOffset: Math.random() * 6,
          leftArm: null,
          rightArm: null,
          jumpY: 0,
          scaleY: 1,
          scaleXZ: 1,
          wobblePhase: Math.random() * Math.PI * 2,
          wobbleAmp: 0,
          isPlatformSpawner: false,
          spawnerSlot: null,
          seatedInfo: null
        };

        root.traverse(child => {
          if (child.isMesh) child.userData.passengerRoot = root;
        });

        return root;
      }

      const isAdult = type === 'adult';
      const scale = isAdult ? 1.06 : 0.72;

      const hitboxGeo = new THREE.CylinderGeometry(0.54 * scale, 0.54 * scale, 1.75 * scale, 12);
      const hitbox = new THREE.Mesh(hitboxGeo, hitboxMat);
      hitbox.position.y = 0.75 * scale;
      root.add(hitbox);

      const bellyGeo = new THREE.SphereGeometry(0.37 * scale, 28, 22);
      bellyGeo.scale(1.02, 1.08, isAdult ? 1.32 : 1.0);
      const belly = new THREE.Mesh(bellyGeo, gummyMat);
      belly.position.y = 0.37 * scale;
      belly.castShadow = true;
      bodyGroup.add(belly);

      const headGeo = new THREE.SphereGeometry(0.28 * scale, 28, 22);
      const head = new THREE.Mesh(headGeo, gummyMat);
      head.position.y = 0.84 * scale;
      head.castShadow = true;
      bodyGroup.add(head);

      const earGeo = new THREE.SphereGeometry(0.10 * scale, 16, 16);
      [-0.18 * scale, 0.18 * scale].forEach(zEar => {
        const ear = new THREE.Mesh(earGeo, gummyMat);
        ear.position.set(0, 1.06 * scale, zEar);
        bodyGroup.add(ear);
      });

      const armGeo = new THREE.CylinderGeometry(0.07 * scale, 0.085 * scale, 0.34 * scale, 14);
      const leftArm = new THREE.Mesh(armGeo, gummyMat);
      leftArm.position.set(-0.04 * scale, 0.50 * scale, -0.39 * scale * (isAdult ? 1.18 : 1));
      leftArm.rotation.x = Math.PI / 3.1;

      const rightArm = new THREE.Mesh(armGeo, gummyMat);
      rightArm.position.set(-0.04 * scale, 0.50 * scale, 0.39 * scale * (isAdult ? 1.18 : 1));
      rightArm.rotation.x = -Math.PI / 3.1;
      bodyGroup.add(leftArm, rightArm);

      const eyesGroup = new THREE.Group();
      eyesGroup.position.set(-0.245 * scale, 0.86 * scale, 0);
      [-0.09 * scale, 0.09 * scale].forEach(zEye => {
        const eyeWhite = new THREE.Mesh(new THREE.SphereGeometry(0.052 * scale, 12, 12), whiteRimMat);
        eyeWhite.position.set(0, 0, zEye);
        const eyePupil = new THREE.Mesh(new THREE.SphereGeometry(0.035 * scale, 12, 12), darkNoteMat);
        eyePupil.position.set(-0.027 * scale, 0, zEye);
        eyesGroup.add(eyeWhite, eyePupil);
      });
      bodyGroup.add(eyesGroup);

      const mouthMesh = new THREE.Mesh(new THREE.SphereGeometry(0.038 * scale, 12, 12), darkNoteMat);
      mouthMesh.position.set(-0.265 * scale, 0.74 * scale, 0);
      mouthMesh.scale.set(0.55, 0.35, 1.05);
      bodyGroup.add(mouthMesh);

      const noteGroup = new THREE.Group();
      noteGroup.position.set(0, 1.18 * scale, 0);
      bodyGroup.add(noteGroup);

      const noteHead = new THREE.Mesh(
        new THREE.SphereGeometry(0.095, 16, 16).scale(1.3, 0.95, 0.95),
        darkNoteMat
      );
      noteHead.rotation.z = -0.35;
      noteGroup.add(noteHead);

      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.38, 10), darkNoteMat);
      stem.position.set(0.08, 0.19, 0);
      noteGroup.add(stem);

      if (!isAdult) {
        const flag = new THREE.Mesh(new THREE.BoxGeometry(0.19, 0.055, 0.035), darkNoteMat);
        flag.position.set(0.16, 0.31, 0);
        flag.rotation.z = -0.48;
        noteGroup.add(flag);
      }

      root.userData = {
        isPassenger: true,
        type,
        flavorIndex,
        gummyMat,
        bodyGroup,
        eyesGroup,
        mouthMesh,
        mouthOpen: 0,
        blinkOffset: Math.random() * 6,
        leftArm,
        rightArm,
        jumpY: 0,
        scaleY: 1,
        scaleXZ: 1,
        wobblePhase: Math.random() * Math.PI * 2,
        wobbleAmp: 0,
        isPlatformSpawner: false,
        spawnerSlot: null,
        seatedInfo: null
      };

      root.traverse(child => {
        if (child.isMesh) {
          child.userData.passengerRoot = root;
        }
      });

      return root;
    }

    // 5.2 Build Foreground Waiting Platform (月台候車區 — Characters Spawn with Random Pitches!)
    const platformGroup = new THREE.Group();
    platformGroup.position.set(0.8, 0, 3.35);
    scene.add(platformGroup);

    const platformPadMat = new THREE.MeshStandardMaterial({ color: 0xe7e2d8, roughness: 0.45 });
    const platformBase = new THREE.Mesh(new THREE.BoxGeometry(7.6, 0.18, 1.85), platformPadMat);
    platformBase.position.y = 0.09;
    platformBase.receiveShadow = true;
    platformBase.castShadow = true;
    platformGroup.add(platformBase);

    const safetyLine = new THREE.Mesh(
      new THREE.BoxGeometry(7.35, 0.02, 0.10),
      new THREE.MeshBasicMaterial({ color: 0xf59e0b })
    );
    safetyLine.position.set(0, 0.185, -0.78);
    platformGroup.add(safetyLine);

    const platformSpawners = [
      { type: 'adult', localX: -2.95, instance: null, padMat: null },
      { type: 'adult', localX: -1.75, instance: null, padMat: null },
      { type: 'child', localX: -0.60, instance: null, padMat: null },
      { type: 'child', localX: 0.35, instance: null, padMat: null },
      { type: 'sixteenth', localX: 1.55, instance: null, padMat: null },
      { type: 'sixteenth', localX: 2.75, instance: null, padMat: null }
    ];

    platformSpawners.forEach((slot) => {
      const padRadius = slot.type === 'adult' ? 0.44 : slot.type === 'sixteenth' ? 0.46 : 0.34;
      const padMat = new THREE.MeshStandardMaterial({
        color: 0xd6d1c7,
        roughness: 0.4,
        transparent: true,
        opacity: 0.42
      });
      const padMesh = new THREE.Mesh(new THREE.CylinderGeometry(padRadius, padRadius, 0.02, 20), padMat);
      if (slot.type === 'sixteenth') padMesh.scale.set(0.82, 1, 1.45);
      padMesh.position.set(slot.localX, 0.19, 0);
      platformGroup.add(padMesh);
      slot.padMat = padMat;
    });

    const allPassengerRoots = [];

    // Spawn waiting-area characters with RANDOM pitch/flavor
    function refillPlatformSpawners() {
      platformSpawners.forEach((slot) => {
        if (!slot.instance) {
          const randomFlavorIdx = Math.floor(Math.random() * FLAVORS.length);
          const p = createGummyPassengerMesh(slot.type, randomFlavorIdx);
          const worldX = platformGroup.position.x + slot.localX;
          const worldZ = platformGroup.position.z;
          p.position.set(worldX, 0.18, worldZ);
          p.userData.isPlatformSpawner = true;
          p.userData.spawnerSlot = slot;
          p.userData.homePos = new THREE.Vector3(worldX, 0.18, worldZ);
          p.userData.wobbleAmp = 0.38;
          scene.add(p);
          allPassengerRoots.push(p);
          slot.instance = p;
          if (slot.padMat) {
            slot.padMat.color.set(FLAVORS[randomFlavorIdx].color);
          }
        }
      });
    }
    refillPlatformSpawners();

    // Randomize all waiting-area characters' pitches
    function randomizePlatformSpawnersPitches() {
      platformSpawners.forEach((slot) => {
        if (slot.instance && slot.instance.userData.isPlatformSpawner) {
          const randomFlavorIdx = Math.floor(Math.random() * FLAVORS.length);
          const f = FLAVORS[randomFlavorIdx];
          slot.instance.userData.flavorIndex = randomFlavorIdx;
          slot.instance.userData.gummyMat.color.set(f.color);
          slot.instance.userData.gummyMat.emissive.set(f.emissive);
          slot.instance.userData.wobbleAmp = 0.42;
          if (slot.padMat) slot.padMat.color.set(f.color);
        }
      });
    }

    function setFlavorSelectionUI(idx) {
      state.selectedFlavor = idx;
      document.querySelectorAll('.flavor-orb').forEach(b => {
        b.classList.toggle('active', parseInt(b.dataset.flavor, 10) === idx);
      });
      const f = FLAVORS[idx] || FLAVORS[0];
      document.getElementById('flavor-name').textContent = f.name;
      document.getElementById('flavor-aura').style.backgroundColor = f.color;
    }

    /********************************************************************
     * 6. SEATING MANAGEMENT (Supports Adult ♩, Child ♪, and Quadruplets ♬×4)
     ********************************************************************/
    function pulseBacksideTrees(strength = 0.12) {
      backsideTrees.forEach(tr => {
        tr.bounceAmp = Math.max(tr.bounceAmp, strength);
      });
    }

    function removePassengerMesh(pRoot) {
      if (!pRoot) return;
      if (pRoot.parent) pRoot.parent.remove(pRoot);
      const idx = allPassengerRoots.indexOf(pRoot);
      if (idx !== -1) allPassengerRoots.splice(idx, 1);
    }

    function clearRow(cIdx, rIdx) {
      const row = state.carriages[cIdx].rows[rIdx];
      if (!row) return;
      if (row.adult) {
        removePassengerMesh(row.adult);
        row.adult = null;
      }
      if (row.sixteenth) {
        removePassengerMesh(row.sixteenth);
        row.sixteenth = null;
      }
      for (let s = 0; s < 2; s++) {
        if (row.seats[s]) {
          removePassengerMesh(row.seats[s]);
          row.seats[s] = null;
        }
      }
      row.mode = 'empty';
    }

    function placeAdultInRow(cIdx, rIdx, flavorIndex, existingMesh = null) {
      if (rIdx >= state.beatsPerBar) return;
      clearRow(cIdx, rIdx);
      const row = state.carriages[cIdx].rows[rIdx];
      const mesh = existingMesh || createGummyPassengerMesh('adult', flavorIndex);
      if (!allPassengerRoots.includes(mesh)) {
        allPassengerRoots.push(mesh);
      }
      trainGroup.add(mesh);
      mesh.position.set(row.localX, 0.72, 0);
      mesh.userData.isPlatformSpawner = false;
      mesh.userData.spawnerSlot = null;
      mesh.userData.seatedInfo = { carriageIndex: cIdx, rowIndex: rIdx, seatIndex: -1 };
      mesh.userData.wobbleAmp = 0.65 * state.wobbleFactor;
      mesh.userData.jumpY = 0.22;
      mesh.userData.mouthOpen = 0.9;

      row.mode = 'adult';
      row.adult = mesh;
      updateScoreAndStats();
    }

    function placeSixteenthInRow(cIdx, rIdx, flavorIndex, existingMesh = null) {
      if (rIdx >= state.beatsPerBar) return;
      clearRow(cIdx, rIdx);
      const row = state.carriages[cIdx].rows[rIdx];
      const mesh = existingMesh || createGummyPassengerMesh('sixteenth', flavorIndex);
      if (!allPassengerRoots.includes(mesh)) {
        allPassengerRoots.push(mesh);
      }
      trainGroup.add(mesh);
      mesh.position.set(row.localX, 0.72, 0);
      mesh.userData.isPlatformSpawner = false;
      mesh.userData.spawnerSlot = null;
      mesh.userData.seatedInfo = { carriageIndex: cIdx, rowIndex: rIdx, seatIndex: -1 };
      mesh.userData.wobbleAmp = 0.72 * state.wobbleFactor;
      mesh.userData.jumpY = 0.24;
      if (mesh.userData.miniFigures) {
        mesh.userData.miniFigures.forEach((mf, idx) => {
          mf.userData.jumpY = 0.18 + idx * 0.04;
          mf.userData.wobbleAmp = 0.75 * state.wobbleFactor;
          mf.userData.mouthOpen = 0.9;
        });
      }

      row.mode = 'sixteenth';
      row.sixteenth = mesh;
      updateScoreAndStats();
    }

    function placeChildInSeat(cIdx, rIdx, sIdx, flavorIndex, existingMesh = null) {
      if (rIdx >= state.beatsPerBar) return;
      const row = state.carriages[cIdx].rows[rIdx];
      if (row.adult) {
        removePassengerMesh(row.adult);
        row.adult = null;
      }
      if (row.sixteenth) {
        removePassengerMesh(row.sixteenth);
        row.sixteenth = null;
      }
      if (row.seats[sIdx]) {
        removePassengerMesh(row.seats[sIdx]);
        row.seats[sIdx] = null;
      }

      const mesh = existingMesh || createGummyPassengerMesh('child', flavorIndex);
      if (!allPassengerRoots.includes(mesh)) {
        allPassengerRoots.push(mesh);
      }
      trainGroup.add(mesh);
      mesh.position.set(row.localX, 0.72, SEAT_Z_OFFSETS[sIdx]);
      mesh.userData.isPlatformSpawner = false;
      mesh.userData.spawnerSlot = null;
      mesh.userData.seatedInfo = { carriageIndex: cIdx, rowIndex: rIdx, seatIndex: sIdx };
      mesh.userData.wobbleAmp = 0.65 * state.wobbleFactor;
      mesh.userData.jumpY = 0.22;
      mesh.userData.mouthOpen = 0.9;

      row.seats[sIdx] = mesh;
      row.mode = (row.seats[0] || row.seats[1]) ? 'children' : 'empty';
      updateScoreAndStats();
    }

    function unseatPassenger(pRoot) {
      const info = pRoot.userData.seatedInfo;
      if (!info) return;
      const row = state.carriages[info.carriageIndex].rows[info.rowIndex];
      if (row) {
        if (row.adult === pRoot) {
          row.adult = null;
          row.mode = 'empty';
        } else if (row.sixteenth === pRoot) {
          row.sixteenth = null;
          row.mode = 'empty';
        } else {
          if (row.seats[0] === pRoot) row.seats[0] = null;
          if (row.seats[1] === pRoot) row.seats[1] = null;
          row.mode = (row.seats[0] || row.seats[1]) ? 'children' : 'empty';
        }
      }
      pRoot.userData.seatedInfo = null;
      updateScoreAndStats();
    }

    function getPassengerWorldPosition(pRoot, zOffset = 0) {
      const worldPos = new THREE.Vector3(0, 0, zOffset);
      pRoot.localToWorld(worldPos);
      return worldPos;
    }

    function getFourSixteenthNotesSVG(isExpanded = false) {
      const sizeClass = isExpanded ? 'w-12 h-8 sm:w-14 sm:h-9' : 'w-9 h-6 sm:w-11 sm:h-7';
      return `
        <svg viewBox="0 0 76 44" class="${sizeClass} mx-auto" fill="currentColor" aria-label="四個十六分音符">
          <rect x="12" y="4.5" width="57" height="5" rx="1.5" />
          <rect x="12" y="12.5" width="57" height="5" rx="1.5" />
          <rect x="12" y="5.5" width="3.5" height="27.5" />
          <rect x="30" y="5.5" width="3.5" height="27.5" />
          <rect x="48" y="5.5" width="3.5" height="27.5" />
          <rect x="65.5" y="5.5" width="3.5" height="27.5" />
          <ellipse cx="8.2" cy="33.5" rx="6.4" ry="4.7" transform="rotate(-18 8.2 33.5)" />
          <ellipse cx="26.2" cy="33.5" rx="6.4" ry="4.7" transform="rotate(-18 26.2 33.5)" />
          <ellipse cx="44.2" cy="33.5" rx="6.4" ry="4.7" transform="rotate(-18 44.2 33.5)" />
          <ellipse cx="62.2" cy="33.5" rx="6.4" ry="4.7" transform="rotate(-18 62.2 33.5)" />
        </svg>
      `;
    }

    function updateScoreAndStats() {
      let adultCount = 0;
      let childCount = 0;
      let sixteenthGroupCount = 0;
      const bpb = state.beatsPerBar;
      const exp = state.scoreExpanded;
      const scoreGrid = document.getElementById('score-grid');
      scoreGrid.className = `grid ${bpb === 3 ? 'grid-cols-6' : 'grid-cols-8'} gap-1.5 sm:gap-2`;
      scoreGrid.innerHTML = '';

      const noteSizeClass = exp ? 'text-2xl sm:text-4xl' : 'text-xl sm:text-2xl';
      const cellHeightClass = exp ? 'min-h-[82px] sm:min-h-[98px] p-2' : 'min-h-[54px] sm:min-h-[62px] px-1.5 py-1';

      for (let c = 0; c < 2; c++) {
        for (let r = 0; r < bpb; r++) {
          const row = state.carriages[c].rows[r];
          const globalBeat = c * bpb + r;

          let symbolHtml = `<span class="${noteSizeClass} font-black leading-none text-stone-400">𝄽</span>`;
          let label = '休止';
          let dotColors = ['#d6d3cd', '#d6d3cd'];

          if (row.mode === 'adult' && row.adult) {
            adultCount++;
            const fIdx = row.adult.userData.flavorIndex;
            const f = FLAVORS[fIdx];
            const pitchShiftPx = (fIdx - 2) * -2.0;
            symbolHtml = `<span class="pitch-glyph inline-block ${noteSizeClass} font-black leading-none" style="transform:translateY(${pitchShiftPx}px);">♩</span>`;
            label = f.short;
            dotColors = [f.color, f.color];
          } else if (row.mode === 'sixteenth' && row.sixteenth) {
            sixteenthGroupCount++;
            const fIdx = row.sixteenth.userData.flavorIndex;
            const f = FLAVORS[fIdx];
            const pitchShiftPx = (fIdx - 2) * -1.8;
            symbolHtml = `<div class="pitch-glyph inline-block w-full" style="transform:translateY(${pitchShiftPx}px);">${getFourSixteenthNotesSVG(exp)}</div>`;
            label = f.short;
            dotColors = [f.color, f.color, f.color, f.color];
          } else if (row.mode === 'children') {
            const s0 = row.seats[0];
            const s1 = row.seats[1];
            if (s0) childCount++;
            if (s1) childCount++;

            if (s0 && s1) {
              const avgF = (s0.userData.flavorIndex + s1.userData.flavorIndex) * 0.5;
              const pitchShiftPx = (avgF - 2) * -2.0;
              symbolHtml = `<span class="pitch-glyph inline-block ${noteSizeClass} font-black leading-none" style="transform:translateY(${pitchShiftPx}px);">♫</span>`;
              label = `${FLAVORS[s0.userData.flavorIndex].short}·${FLAVORS[s1.userData.flavorIndex].short}`;
              dotColors = [FLAVORS[s0.userData.flavorIndex].color, FLAVORS[s1.userData.flavorIndex].color];
            } else if (s0 && !s1) {
              symbolHtml = `<span class="text-lg sm:text-xl font-black leading-none">♪ 𝄾</span>`;
              label = FLAVORS[s0.userData.flavorIndex].short;
              dotColors = [FLAVORS[s0.userData.flavorIndex].color, '#d6d3cd'];
            } else if (!s0 && s1) {
              symbolHtml = `<span class="text-lg sm:text-xl font-black leading-none">𝄾 ♪</span>`;
              label = FLAVORS[s1.userData.flavorIndex].short;
              dotColors = ['#d6d3cd', FLAVORS[s1.userData.flavorIndex].color];
            }
          }

          const dotsHtml = dotColors.map(col =>
            `<span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full border border-black/15" style="background:${col}"></span>`
          ).join('');

          const carriageBorderClass = c === 0
            ? 'border-sky-300/90 bg-sky-50/40'
            : 'border-amber-300/90 bg-amber-50/40';
          const measureDividerClass = (r === 0 && c === 1) ? 'ml-1 ring-1 ring-amber-400/60' : '';
          const downbeatClass = r === 0 ? 'downbeat-cell' : '';

          const cell = document.createElement('button');
          cell.id = `score-beat-${globalBeat}`;
          cell.type = 'button';
          cell.className = `beat-cell ${downbeatClass} rounded-xl ${cellHeightClass} bg-white hover:bg-stone-50 border ${carriageBorderClass} ${measureDividerClass} flex flex-col items-center justify-between cursor-pointer text-stone-900 shadow-sm`;
          cell.innerHTML = `
            <div class="w-full flex items-center justify-between text-[9px] sm:text-[10px] mono-label font-bold text-stone-500 leading-none">
              <span>${c + 1}-${r + 1}</span>
              <span class="flex gap-0.5">${dotsHtml}</span>
            </div>
            <div class="my-0.5 flex items-center justify-center w-full">${symbolHtml}</div>
            <div class="beat-subtext text-[9px] sm:text-[10px] font-extrabold text-stone-600 truncate w-full text-center leading-none">${label}</div>
          `;

          cell.addEventListener('click', () => {
            if (state.trainPhase === 'station') {
              triggerRowPreview(c, r);
            }
          });

          scoreGrid.appendChild(cell);
        }
      }

      const totalFigures = adultCount + childCount + sixteenthGroupCount * 4;
      document.getElementById('stat-passengers').textContent = totalFigures;
      document.getElementById('stat-subtext').textContent = `大人${adultCount}·小孩${childCount}·四胞胎${sixteenthGroupCount}`;
    }

    /********************************************************************
     * 7. 100% RELIABLE 3D DRAG-AND-DROP (Capture Phase Pointer Events)
     ********************************************************************/
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -1.15);
    const dragIntersectPoint = new THREE.Vector3();

    let draggedPassenger = null;
    let activePointerId = null;
    let pointerDownScreenPos = { x: 0, y: 0 };
    let hoveredSeatData = null;

    function updatePointerNDC(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function clearAllSeatHighlights() {
      for (let c = 0; c < 2; c++) {
        for (let r = 0; r < state.beatsPerBar; r++) {
          const row = state.carriages[c].rows[r];
          if (!row) continue;
          if (row.rowHighlightMesh) row.rowHighlightMesh.material.opacity = 0;
          row.seatMeshes.forEach(m => {
            m.material.emissive.setHex(0x000000);
            m.material.emissiveIntensity = 0;
          });
        }
      }
    }

    function findTargetSeatForPoint(worldPt, passengerType) {
      if (state.trainPhase !== 'station') return null;
      let bestMatch = null;
      let minDist = 1.35;

      for (let c = 0; c < 2; c++) {
        for (let r = 0; r < state.beatsPerBar; r++) {
          const row = state.carriages[c].rows[r];
          const rowWorldX = trainGroup.position.x + row.localX;
          if (passengerType === 'adult' || passengerType === 'sixteenth') {
            const dx = worldPt.x - rowWorldX;
            const dz = worldPt.z - 0;
            const dist = Math.hypot(dx, dz * 0.6);
            if (dist < minDist) {
              minDist = dist;
              bestMatch = { carriageIndex: c, rowIndex: r, seatIndex: -1 };
            }
          } else {
            for (let s = 0; s < 2; s++) {
              const dx = worldPt.x - rowWorldX;
              const dz = worldPt.z - SEAT_Z_OFFSETS[s];
              const dist = Math.hypot(dx, dz);
              if (dist < minDist) {
                minDist = dist;
                bestMatch = { carriageIndex: c, rowIndex: r, seatIndex: s };
              }
            }
          }
        }
      }
      return bestMatch;
    }

    function onPointerDownCapture(e) {
      if (e.button === 2) return;
      if (state.trainPhase !== 'station') return;

      updatePointerNDC(e);
      pointerDownScreenPos = { x: e.clientX, y: e.clientY };
      raycaster.setFromCamera(pointer, camera);

      const passengerMeshes = [];
      allPassengerRoots.forEach(root => {
        root.traverse(ch => {
          if (ch.isMesh) passengerMeshes.push(ch);
        });
      });

      const hits = raycaster.intersectObjects(passengerMeshes, false);
      if (hits.length > 0) {
        const hitRoot = hits[0].object.userData.passengerRoot;
        if (hitRoot) {
          e.stopPropagation();
          controls.enabled = false;

          draggedPassenger = hitRoot;
          activePointerId = e.pointerId;
          try {
            renderer.domElement.setPointerCapture(e.pointerId);
          } catch (_) {}

          const worldPos = getPassengerWorldPosition(hitRoot);
          scene.add(hitRoot);
          hitRoot.position.copy(worldPos);
          hitRoot.position.y = 1.25;

          if (hitRoot.userData.seatedInfo) {
            unseatPassenger(hitRoot);
          }

          setFlavorSelectionUI(hitRoot.userData.flavorIndex);
          setPassengerTypeUI(hitRoot.userData.type);
          playPopSound(hitRoot.userData.type === 'adult' ? 380 : 560);
          document.body.style.cursor = 'grabbing';
        }
      }
    }

    function onPointerMove(e) {
      if (state.trainPhase !== 'station') return;
      updatePointerNDC(e);
      raycaster.setFromCamera(pointer, camera);

      if (draggedPassenger) {
        e.stopPropagation();
        if (raycaster.ray.intersectPlane(dragPlane, dragIntersectPoint)) {
          draggedPassenger.position.x = dragIntersectPoint.x;
          draggedPassenger.position.z = dragIntersectPoint.z;
          draggedPassenger.position.y = 1.28;
          draggedPassenger.userData.scaleY = 1.22;
          draggedPassenger.userData.scaleXZ = 0.88;

          clearAllSeatHighlights();
          hoveredSeatData = findTargetSeatForPoint(draggedPassenger.position, draggedPassenger.userData.type);
          if (hoveredSeatData) {
            const row = state.carriages[hoveredSeatData.carriageIndex].rows[hoveredSeatData.rowIndex];
            if (draggedPassenger.userData.type === 'adult' || draggedPassenger.userData.type === 'sixteenth') {
              row.rowHighlightMesh.material.opacity = 0.65;
              row.seatMeshes.forEach(m => {
                m.material.emissive.setHex(0x10b981);
                m.material.emissiveIntensity = 0.65;
              });
            } else {
              const seatMesh = row.seatMeshes[hoveredSeatData.seatIndex];
              seatMesh.material.emissive.setHex(0x10b981);
              seatMesh.material.emissiveIntensity = 0.75;
            }
          }
        }
        return;
      }

      const passengerMeshes = [];
      allPassengerRoots.forEach(r => r.traverse(ch => { if (ch.isMesh) passengerMeshes.push(ch); }));
      const pHits = raycaster.intersectObjects(passengerMeshes, false);
      if (pHits.length > 0) {
        document.body.style.cursor = 'grab';
        return;
      }

      const sHits = raycaster.intersectObjects(interactiveSeatMeshes, false);
      document.body.style.cursor = sHits.length > 0 ? 'pointer' : 'default';
    }

    function onPointerUp(e) {
      const moveDist = Math.hypot(e.clientX - pointerDownScreenPos.x, e.clientY - pointerDownScreenPos.y);

      if (draggedPassenger) {
        try {
          if (activePointerId !== null) renderer.domElement.releasePointerCapture(activePointerId);
        } catch (_) {}
        activePointerId = null;

        clearAllSeatHighlights();
        const target = findTargetSeatForPoint(draggedPassenger.position, draggedPassenger.userData.type);

        if (target) {
          if (draggedPassenger.userData.isPlatformSpawner && draggedPassenger.userData.spawnerSlot) {
            draggedPassenger.userData.spawnerSlot.instance = null;
            draggedPassenger.userData.isPlatformSpawner = false;
            draggedPassenger.userData.spawnerSlot = null;
            refillPlatformSpawners();
          }

          if (draggedPassenger.userData.type === 'adult') {
            placeAdultInRow(target.carriageIndex, target.rowIndex, draggedPassenger.userData.flavorIndex, draggedPassenger);
            playPassengerSound('adult', draggedPassenger.userData.flavorIndex, 0.45);
            spawnRollCallBadge(draggedPassenger, '♩ 入座 (1拍)');
            spawnNoteBurst(getPassengerWorldPosition(draggedPassenger), draggedPassenger.userData.flavorIndex, 4);
          } else if (draggedPassenger.userData.type === 'sixteenth') {
            placeSixteenthInRow(target.carriageIndex, target.rowIndex, draggedPassenger.userData.flavorIndex, draggedPassenger);
            for (let k = 0; k < 4; k++) {
              setTimeout(() => {
                playPassengerSound('sixteenth', draggedPassenger.userData.flavorIndex, 0.12, k);
              }, k * 95);
            }
            spawnRollCallBadge(draggedPassenger, '♬ 四胞胎入座 (16分×4)');
            spawnNoteBurst(getPassengerWorldPosition(draggedPassenger), draggedPassenger.userData.flavorIndex, 5);
          } else {
            placeChildInSeat(target.carriageIndex, target.rowIndex, target.seatIndex, draggedPassenger.userData.flavorIndex, draggedPassenger);
            playPassengerSound('child', draggedPassenger.userData.flavorIndex, 0.25);
            spawnRollCallBadge(draggedPassenger, '♪ 入座 (半拍)');
            spawnNoteBurst(getPassengerWorldPosition(draggedPassenger), draggedPassenger.userData.flavorIndex, 3);
          }
        } else {
          if (draggedPassenger.userData.isPlatformSpawner && draggedPassenger.userData.homePos) {
            draggedPassenger.position.copy(draggedPassenger.userData.homePos);
            draggedPassenger.userData.wobbleAmp = 0.45;
            playPopSound(320);
          } else {
            playPopSound(250);
            removePassengerMesh(draggedPassenger);
            updateScoreAndStats();
          }
        }

        draggedPassenger = null;
        hoveredSeatData = null;
        controls.enabled = true;
        document.body.style.cursor = 'default';
        return;
      }

      if (moveDist < 7 && state.trainPhase === 'station') {
        updatePointerNDC(e);
        raycaster.setFromCamera(pointer, camera);

        const seatHits = raycaster.intersectObjects(interactiveSeatMeshes, false);
        if (seatHits.length > 0) {
          const { carriageIndex, rowIndex, seatIndex } = seatHits[0].object.userData;
          if (state.selectedPassengerType === 'adult') {
            placeAdultInRow(carriageIndex, rowIndex, state.selectedFlavor);
            const p = state.carriages[carriageIndex].rows[rowIndex].adult;
            playPassengerSound('adult', state.selectedFlavor, 0.45);
            if (p) {
              spawnRollCallBadge(p, '♩ 1拍');
              spawnNoteBurst(getPassengerWorldPosition(p), state.selectedFlavor, 4);
            }
          } else if (state.selectedPassengerType === 'sixteenth') {
            placeSixteenthInRow(carriageIndex, rowIndex, state.selectedFlavor);
            const p = state.carriages[carriageIndex].rows[rowIndex].sixteenth;
            for (let k = 0; k < 4; k++) {
              setTimeout(() => {
                playPassengerSound('sixteenth', state.selectedFlavor, 0.12, k);
              }, k * 95);
            }
            if (p) {
              spawnRollCallBadge(p, '♬ 16分×4');
              spawnNoteBurst(getPassengerWorldPosition(p), state.selectedFlavor, 5);
            }
          } else {
            placeChildInSeat(carriageIndex, rowIndex, seatIndex, state.selectedFlavor);
            const p = state.carriages[carriageIndex].rows[rowIndex].seats[seatIndex];
            playPassengerSound('child', state.selectedFlavor, 0.25);
            if (p) {
              spawnRollCallBadge(p, '♪ 半拍');
              spawnNoteBurst(getPassengerWorldPosition(p), state.selectedFlavor, 3);
            }
          }
        }
      }
    }

    window.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (state.trainPhase !== 'station') return;
      updatePointerNDC(e);
      raycaster.setFromCamera(pointer, camera);
      const passengerMeshes = [];
      allPassengerRoots.forEach(r => r.traverse(ch => { if (ch.isMesh) passengerMeshes.push(ch); }));
      const hits = raycaster.intersectObjects(passengerMeshes, false);
      if (hits.length > 0) {
        const hitRoot = hits[0].object.userData.passengerRoot;
        if (hitRoot && hitRoot.userData.seatedInfo) {
          unseatPassenger(hitRoot);
          removePassengerMesh(hitRoot);
          playPopSound(240);
        }
      }
    });

    renderer.domElement.addEventListener('pointerdown', onPointerDownCapture, { capture: true });
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);

    /********************************************************************
     * 8. ROLL CALL ("點名") SEQUENCER, AUTO-HIDE UI & TRAIN DEPARTURE
     ********************************************************************/
    const worldLabelsContainer = document.getElementById('world-labels');
    const persistentWorldLabels = [];

    function createPersistentLabel(text, subtext, localPos, followTrain = true) {
      const el = document.createElement('div');
      el.className = 'world-label text-center';
      el.innerHTML = `
        <div class="px-3 py-1 rounded-full bg-white/92 backdrop-blur-md border border-stone-300 shadow-md">
          <span class="label-main mono-label text-[10px] font-black tracking-wider uppercase text-stone-900">${text}</span>
          ${subtext ? `<span class="label-sub text-[10px] font-semibold text-stone-600 ml-1">${subtext}</span>` : ''}
        </div>
      `;
      worldLabelsContainer.appendChild(el);
      const item = { el, localPos, followTrain };
      persistentWorldLabels.push(item);
      return item;
    }

    const labelCarriage1 = createPersistentLabel('第一節車廂', '1–4 拍', new THREE.Vector3(-1.25, 2.25, 0), true);
    const labelCarriage2 = createPersistentLabel('第二節車廂', '1–4 拍', new THREE.Vector3(3.55, 2.25, 0), true);
    const labelPlatform = createPersistentLabel('月台候車區', '', new THREE.Vector3(0.8, 0.1, 4.45), false);

    function updateCarriageWorldLabels() {
      const cfg = getCarriageLayoutConfig(state.beatsPerBar);
      labelCarriage1.localPos.x = cfg.centers[0];
      labelCarriage2.localPos.x = cfg.centers[1];
      const subText = `1–${state.beatsPerBar} 拍`;
      const sub1 = labelCarriage1.el.querySelector('.label-sub');
      const sub2 = labelCarriage2.el.querySelector('.label-sub');
      if (sub1) sub1.textContent = subText;
      if (sub2) sub2.textContent = subText;
    }

    function spawnRollCallBadge(passengerRoot, text, zOffset = 0) {
      if (!passengerRoot) return;
      const pos = getPassengerWorldPosition(passengerRoot, zOffset);
      pos.y += 1.45;
      pos.project(camera);

      const x = (pos.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-(pos.y * 0.5) + 0.5) * window.innerHeight;

      const f = FLAVORS[passengerRoot.userData.flavorIndex] || FLAVORS[0];
      const badge = document.createElement('div');
      badge.className = 'rollcall-pop px-3.5 py-1 rounded-full font-black text-xs shadow-xl border-2 border-white flex items-center gap-1';
      badge.style.left = `${x}px`;
      badge.style.top = `${y}px`;
      badge.style.backgroundColor = f.color;
      badge.style.color = '#ffffff';
      badge.innerHTML = `<span>${text}</span>`;
      document.body.appendChild(badge);

      setTimeout(() => badge.remove(), 780);
    }

    function clearSubTimers() {
      state.subTimers.forEach(t => clearTimeout(t));
      state.subTimers = [];
    }

    function triggerSixteenthQuadrupletBeat(pRoot, beatDurationSec) {
      if (!pRoot) return;
      const sixteenthSec = beatDurationSec / 4;
      const syllables = ['滴! ♬', '哩! ♬', '滴! ♬', '啦! ♬'];
      const zPositions = [-0.57, -0.19, 0.19, 0.57];
      const f = FLAVORS[pRoot.userData.flavorIndex];

      for (let k = 0; k < 4; k++) {
        const timerId = setTimeout(() => {
          if (!pRoot.parent) return;
          if (pRoot.userData.miniFigures && pRoot.userData.miniFigures[k]) {
            const mf = pRoot.userData.miniFigures[k];
            mf.userData.jumpY = 0.46;
            mf.userData.wobbleAmp = 0.95 * state.wobbleFactor;
            mf.userData.mouthOpen = 1.0;
          }
          pRoot.userData.wobbleAmp = Math.max(pRoot.userData.wobbleAmp, 0.45 * state.wobbleFactor);
          playPassengerSound('sixteenth', pRoot.userData.flavorIndex, sixteenthSec * 0.88, k);
          spawnRollCallBadge(pRoot, `${syllables[k]} (${f.short})`, zPositions[k]);
          spawnNoteBurst(getPassengerWorldPosition(pRoot, zPositions[k]), pRoot.userData.flavorIndex, 2);
        }, k * sixteenthSec * 1000);
        state.subTimers.push(timerId);
      }
    }

    const centerBanner = document.getElementById('center-banner');
    const bannerIcon = document.getElementById('banner-icon');
    const bannerTitle = document.getElementById('banner-title');
    const bannerDesc = document.getElementById('banner-desc');
    const bannerActionBtn = document.getElementById('banner-action-btn');

    function showBanner(icon, title, desc, btnText) {
      bannerIcon.textContent = icon;
      bannerTitle.textContent = title;
      bannerDesc.textContent = desc;
      bannerActionBtn.textContent = btnText;
      centerBanner.classList.remove('is-hidden', 'opacity-0', 'scale-95', 'pointer-events-none');
      centerBanner.classList.add('opacity-100', 'scale-100', 'pointer-events-auto');
    }

    function hideBanner() {
      centerBanner.classList.add('is-hidden', 'opacity-0', 'scale-95', 'pointer-events-none');
      centerBanner.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto');
    }

    function triggerRowPreview(cIdx, rIdx) {
      const row = state.carriages[cIdx].rows[rIdx];
      if (!row) return;
      const beatDurationSec = 60 / state.bpm;

      playheadBeam.position.x = row.localX;
      playheadBeamMat.opacity = 0.28;
      pulseBacksideTrees(0.08);
      setTimeout(() => {
        if (!state.isPlaying) playheadBeamMat.opacity = 0;
      }, beatDurationSec * 1000);

      if (row.mode === 'adult' && row.adult) {
        const p = row.adult;
        p.userData.jumpY = 0.45;
        p.userData.wobbleAmp = 0.9 * state.wobbleFactor;
        p.userData.mouthOpen = 1.0;
        const f = FLAVORS[p.userData.flavorIndex];
        playPassengerSound('adult', p.userData.flavorIndex, beatDurationSec * 0.92);
        spawnRollCallBadge(p, `答! ♩ (${f.short})`);
        spawnNoteBurst(getPassengerWorldPosition(p), p.userData.flavorIndex, 4);
      } else if (row.mode === 'sixteenth' && row.sixteenth) {
        triggerSixteenthQuadrupletBeat(row.sixteenth, beatDurationSec);
      } else if (row.mode === 'children') {
        if (row.seats[0]) {
          const p0 = row.seats[0];
          p0.userData.jumpY = 0.38;
          p0.userData.wobbleAmp = 0.8 * state.wobbleFactor;
          p0.userData.mouthOpen = 1.0;
          const f0 = FLAVORS[p0.userData.flavorIndex];
          playPassengerSound('child', p0.userData.flavorIndex, beatDurationSec * 0.42);
          spawnRollCallBadge(p0, `滴! ♪ (${f0.short})`, SEAT_Z_OFFSETS[0]);
          spawnNoteBurst(getPassengerWorldPosition(p0), p0.userData.flavorIndex, 3);
        }
        if (row.seats[1]) {
          setTimeout(() => {
            const p1 = row.seats[1];
            if (!p1) return;
            p1.userData.jumpY = 0.38;
            p1.userData.wobbleAmp = 0.8 * state.wobbleFactor;
            p1.userData.mouthOpen = 1.0;
            const f1 = FLAVORS[p1.userData.flavorIndex];
            playPassengerSound('child', p1.userData.flavorIndex, beatDurationSec * 0.42);
            spawnRollCallBadge(p1, `嗒! ♪ (${f1.short})`, SEAT_Z_OFFSETS[1]);
            spawnNoteBurst(getPassengerWorldPosition(p1), p1.userData.flavorIndex, 3);
          }, beatDurationSec * 500);
        }
      } else {
        playTrainTick(true, false);
      }
    }

    function advanceRollCallStep() {
      if (!state.isPlaying) return;

      state.currentStep++;
      const totalBeats = state.beatsPerBar * 2;
      const totalSteps = totalBeats * 2;

      if (state.currentStep >= totalSteps) {
        stopRollCall(true);
        return;
      }

      const step = state.currentStep;
      const globalBeat = Math.floor(step / 2);
      const subBeat = step % 2;
      const carriageIndex = Math.floor(globalBeat / state.beatsPerBar);
      const rowIndex = globalBeat % state.beatsPerBar;

      const row = state.carriages[carriageIndex].rows[rowIndex];
      const beatDurationSec = 60 / state.bpm;
      const halfBeatSec = beatDurationSec / 2;

      playheadBeam.position.x = row.localX;
      playheadBeamMat.opacity = subBeat === 0 ? 0.34 : 0.20;

      const beatText = `${rowIndex + 1}/${state.beatsPerBar}${subBeat === 1 ? ' &' : ''}`;
      const pct = `${((step + 1) / totalSteps) * 100}%`;

      document.getElementById('stat-beat').textContent = beatText;
      document.getElementById('beat-progress-bar').style.width = pct;
      document.getElementById('hud-carriage-label').textContent = carriageIndex === 0 ? '第一節車廂' : '第二節車廂';
      document.getElementById('hud-beat-badge').textContent = beatText;
      document.getElementById('hud-progress-bar').style.width = pct;

      for (let b = 0; b < totalBeats; b++) {
        const cell = document.getElementById(`score-beat-${b}`);
        if (cell) cell.classList.toggle('playing', b === globalBeat);
      }

      clearAllSeatHighlights();
      if (row.mode === 'adult' || row.mode === 'sixteenth') {
        row.seatMeshes.forEach(m => {
          m.material.emissive.setHex(0xf59e0b);
          m.material.emissiveIntensity = 0.65;
        });
      } else {
        const activeSeatMesh = row.seatMeshes[subBeat];
        if (activeSeatMesh) {
          activeSeatMesh.material.emissive.setHex(0xf59e0b);
          activeSeatMesh.material.emissiveIntensity = 0.75;
        }
      }

      playTrainTick(subBeat === 0, subBeat === 0 && rowIndex === 0);
      if (subBeat === 0) {
        spawnSteamPuff(globalBeat, rowIndex === 0 ? 1.25 : 0.95);
        pulseBacksideTrees(rowIndex === 0 ? 0.14 : 0.07);
      }

      if (row.mode === 'adult' && row.adult) {
        if (subBeat === 0) {
          const p = row.adult;
          p.userData.jumpY = 0.48;
          p.userData.wobbleAmp = 0.95 * state.wobbleFactor;
          p.userData.mouthOpen = 1.0;
          const f = FLAVORS[p.userData.flavorIndex];
          playPassengerSound('adult', p.userData.flavorIndex, beatDurationSec * 0.92);
          spawnRollCallBadge(p, `點名：大人 ♩ (${f.short})`);
          spawnNoteBurst(getPassengerWorldPosition(p), p.userData.flavorIndex, 4);
        } else {
          row.adult.userData.wobbleAmp = Math.max(row.adult.userData.wobbleAmp, 0.4 * state.wobbleFactor);
          row.adult.userData.mouthOpen = Math.max(row.adult.userData.mouthOpen, 0.65);
        }
      } else if (row.mode === 'sixteenth' && row.sixteenth) {
        if (subBeat === 0) {
          triggerSixteenthQuadrupletBeat(row.sixteenth, beatDurationSec);
        }
      } else if (row.mode === 'children') {
        const childPassenger = row.seats[subBeat];
        if (childPassenger) {
          childPassenger.userData.jumpY = 0.42;
          childPassenger.userData.wobbleAmp = 0.88 * state.wobbleFactor;
          childPassenger.userData.mouthOpen = 1.0;
          const f = FLAVORS[childPassenger.userData.flavorIndex];
          playPassengerSound('child', childPassenger.userData.flavorIndex, halfBeatSec * 0.88);
          spawnRollCallBadge(childPassenger, `${subBeat === 0 ? '滴' : '嗒'}! 小孩 ♪ (${f.short})`, SEAT_Z_OFFSETS[subBeat]);
          spawnNoteBurst(getPassengerWorldPosition(childPassenger), childPassenger.userData.flavorIndex, 3);
        }
      }

      state.stepTimer = setTimeout(advanceRollCallStep, halfBeatSec * 1000);
    }

    function startRollCall() {
      ensureAudio();
      if (state.trainPhase !== 'station') {
        arriveTrainAtStation();
        return;
      }
      if (state.isPlaying) return;
      hideBanner();
      clearSubTimers();
      document.getElementById('btn-depart').classList.remove('depart-ready');

      state.isPlaying = true;
      state.currentStep = -1;

      document.body.classList.add('is-playing-rollcall');
      labelPlatform.el.style.display = 'none';
      const minimalHud = document.getElementById('playback-minimal-hud');
      minimalHud.classList.remove('is-hidden', 'opacity-0', '-translate-y-4', 'pointer-events-none');
      minimalHud.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto');

      document.getElementById('play-icon').textContent = '■';
      document.getElementById('play-text').textContent = '停止點名 (Stop Roll Call)';
      document.getElementById('btn-play').classList.replace('bg-[#18181b]', 'bg-rose-600');
      document.getElementById('btn-play').classList.replace('hover:bg-stone-800', 'hover:bg-rose-700');
      advanceRollCallStep();
    }

    function stopRollCall(completedFullCycle = false) {
      state.isPlaying = false;
      if (state.stepTimer) {
        clearTimeout(state.stepTimer);
        state.stepTimer = null;
      }

    function departTrain() {
      ensureAudio();

      if (state.trainPhase !== 'station') return;

      state.trainPhase = 'departing';

      state.chugTimer = 0;

      // Switch railway signal light to red as train departs
      if (signalGreenMat && signalRedMat) {
        signalGreenMat.emissiveIntensity = 0.12;
        signalRedMat.emissiveIntensity = 1.25;
      }

      // Save user's pre-departure camera view & start 3-stage departure camera choreography
      if (!state.departCamActive) {
        state.savedCamPos = camTransition ? camTransition.endPos.clone() : camera.position.clone();
        state.savedCamTarget = camTransition ? camTransition.endLook.clone() : controls.target.clone();
      }
      camTransition = null;
      controls.enableDamping = false;
      state.departCamTimer = 0;
      state.departCamActive = true;

      playTrainWhistle();

      document.getElementById('depart-icon').textContent = '💨';
      document.getElementById('depart-text').textContent = '列車加速駛離中...';
      document.getElementById('status-label').textContent = 'TRAIN DEPARTING · 列車出發中！';

      allPassengerRoots.forEach((p, idx) => {

          p.userData.wobbleAmp = 1.0;
          p.userData.mouthOpen = 1.0;

    /********************************************************************
     * 10. MAIN ANIMATION LOOP (3-Stage Departure Cam, Scenery & Jelly Wobble)
     ********************************************************************/
    const clock = new THREE.Clock();
    const _viewVec = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      // 0. Camera Update: 3-Stage Departure Choreography vs Preset Flight vs OrbitControls
      if (state.departCamActive && state.savedCamPos && state.savedCamTarget) {
        state.departCamTimer += dt;
        const t = state.departCamTimer;

        const releaseWeight = 1.0 - smootherstep(1.8, 2.55, t);
        const stage1In = smootherstep(0.0, 0.3, t);
        const pushRatio = 0.026 * stage1In * releaseWeight;
        const locoGazeLeadX = -0.35 * stage1In * releaseWeight;
        const initialCamLeadX = -0.12 * stage1In * releaseWeight;

        const stage2Pan = smootherstep(0.26, 1.8, t) * releaseWeight;
        const panTrackX = -1.55 * stage2Pan;

        _viewVec.subVectors(state.savedCamTarget, state.savedCamPos);

        camera.position.set(
          state.savedCamPos.x + _viewVec.x * pushRatio + initialCamLeadX + panTrackX,
          state.savedCamPos.y + _viewVec.y * pushRatio,
          state.savedCamPos.z + _viewVec.z * pushRatio
        );

        controls.target.set(
          state.savedCamTarget.x + locoGazeLeadX + panTrackX,
          state.savedCamTarget.y,
          state.savedCamTarget.z
        );
        controls.update();

        if (t >= 2.55) {
          camera.position.copy(state.savedCamPos);
          controls.target.copy(state.savedCamTarget);
          state.departCamActive = false;
          state.savedCamPos = null;
          state.savedCamTarget = null;
          controls.enableDamping = true;
          controls.update();
        }
      } else if (camTransition) {
        camTransition.progress += dt / camTransition.duration;
        const t = Math.min(1, camTransition.progress);
        const ease = 1 - Math.pow(1 - t, 3);
        camera.position.lerpVectors(camTransition.startPos, camTransition.endPos, ease);
        controls.target.lerpVectors(camTransition.startLook, camTransition.endLook, ease);
        controls.update();
        if (t >= 1) {
          camTransition = null;
          controls.enableDamping = true;
        }
      } else {
        controls.update();
      }

      // 0b. Animate Back-Side Scenery (Trees breeze sway, beat bounce, lamps & station clock)
      const lampPulse = 0.72 + Math.sin(elapsed * (state.bpm / 60) * Math.PI * 2) * 0.25;
      backsideLampBulbs.forEach(mat => {
        mat.emissiveIntensity = lampPulse;
      });
      if (clockMinuteHand) {
        clockMinuteHand.rotation.z = -elapsed * 0.35;
      }

      backsideTrees.forEach(tr => {
        tr.group.rotation.z = Math.sin(elapsed * 1.7 + tr.phase) * 0.025;
        if (tr.bounceAmp > 0.002) {
          const s = tr.baseScale * (1 + tr.bounceAmp);
          tr.group.scale.set(tr.baseScale * (1 - tr.bounceAmp * 0.35), s, tr.baseScale * (1 - tr.bounceAmp * 0.35));
          tr.bounceAmp *= Math.pow(0.05, dt);
        } else {
          tr.bounceAmp = 0;
          tr.group.scale.setScalar(tr.baseScale);
        }

        if (state.trainPhase === 'departing') {
          tr.group.position.x += state.trainVelocity * dt * 0.16;
          if (tr.group.position.x > 14.5) tr.group.position.x = -14.5;
        } else if (state.trainPhase === 'station') {
          tr.group.position.x = THREE.MathUtils.lerp(tr.group.position.x, tr.baseX, dt * 3);
        }
      });

      const allWheels = [...locoWheelMeshes, ...carriageWheelMeshes];

      // 1. Handle Train Phase ('station' | 'departing' | 'departed' | 'arriving')
      if (state.trainPhase === 'departing') {
        state.trainVelocity += dt * 7.8;
        state.trainX -= state.trainVelocity * dt;
        trainGroup.position.x = state.trainX;

        allWheels.forEach(w => {
          w.rotation.z += state.trainVelocity * dt * 2.8;
        });

        locoGroup.position.y = Math.abs(Math.sin(elapsed * 18)) * 0.055;
        state.chugTimer += dt * (1.2 + state.trainVelocity * 0.35);
        if (state.chugTimer >= 0.26) {
          state.chugTimer = 0;
          spawnSteamPuff(Math.floor(Math.random() * FLAVORS.length), 1.25);
          if (state.trainX > -22) {
            playSteamChugSound(Math.min(1.0, 0.4 + state.trainVelocity * 0.05));
          }
        }

        allPassengerRoots.forEach((p, idx) => {
          if (p.userData.seatedInfo) {
            p.userData.jumpY = Math.abs(Math.sin(elapsed * 10 + idx)) * 0.22;
            p.userData.wobbleAmp = Math.max(p.userData.wobbleAmp, 0.35);
          }
        });

        if (state.trainX < -25) {
          state.trainPhase = 'departed';
          state.trainVelocity = 0;
          document.getElementById('depart-icon').textContent = '🔔';
          document.getElementById('depart-text').textContent = '迎接下一班列車 (列車進站)';
          document.getElementById('status-label').textContent = 'TRAIN DEPARTED · 列車已出發！';
          showBanner(
            '🚂',
            '列車已順利載著乘客出發！',
            `想再練習新的 ${state.beatsPerBar}/4 拍節奏嗎？點擊下方按鈕讓列車進站！`,
            '🔔 迎接下一班列車 (進站)'
          );
        }
      } else if (state.trainPhase === 'arriving') {
        const distToStation = state.trainX - 0;
        const speed = Math.max(1.2, distToStation * 3.2);
        state.trainX -= speed * dt;

        if (state.trainX <= 0.02) {
          state.trainX = 0;
          trainGroup.position.x = 0;
          state.trainPhase = 'station';
          locoGroup.position.y = 0;
          playPopSound(520);
          spawnSteamPuff(0, 1.3);
          pulseBacksideTrees(0.12);
          document.getElementById('depart-icon').textContent = '🚂';
          document.getElementById('depart-text').textContent = '2. 點完名・列車出發 (Depart)';
          document.getElementById('status-label').textContent = `RHYTHM PHYSICS · ${state.beatsPerBar}/4 ROLL CALL`;
        } else {
          trainGroup.position.x = state.trainX;
          allWheels.forEach(w => {
            w.rotation.z += speed * dt * 2.5;
          });
          locoGroup.position.y = Math.abs(Math.sin(elapsed * 14)) * 0.035;
        }
      } else if (state.isPlaying) {
        allWheels.forEach(w => {
          w.rotation.z += dt * (state.bpm / 32);
        });
        locoGroup.position.y = Math.abs(Math.sin(elapsed * (state.bpm / 60) * Math.PI * 2)) * 0.035;
      } else {
        locoGroup.position.y = THREE.MathUtils.lerp(locoGroup.position.y, 0, 0.15);
      }

      if (locoWheelMeshes.length > 0) {
        const wheelAngle = locoWheelMeshes[0].rotation.z;
        locoConnectingRods.forEach(rod => {
          rod.mesh.position.x = rod.baseX + Math.cos(wheelAngle) * 0.12;
          rod.mesh.position.y = rod.baseY + Math.sin(wheelAngle) * 0.12;
        });
      }

      // 2. Animate Gummy Passengers (Blinking, Singing Mouth, Wobble & 16th-Note Quadruplets)
      allPassengerRoots.forEach(p => {
        const u = p.userData;

        if (u.eyesGroup) {
          const blinkCycle = (elapsed + u.blinkOffset) % 4.2;
          u.eyesGroup.scale.y = (blinkCycle > 4.04) ? 0.1 : 1.0;
        }

        if (u.mouthMesh) {
          if (u.mouthOpen > 0.01) {
            u.mouthOpen = THREE.MathUtils.lerp(u.mouthOpen, 0, dt * 6.5);
            const pitchScale = 1 + (u.flavorIndex || 0) * 0.08;
            u.mouthMesh.scale.set(
              0.55 + u.mouthOpen * 0.55,
              0.35 + u.mouthOpen * 1.45 * pitchScale,
              1.05 + u.mouthOpen * 0.35
            );
          } else {
            u.mouthOpen = 0;
            u.mouthMesh.scale.set(0.55, 0.35, 1.05);
          }
        }

        if (p === draggedPassenger) {
          u.bodyGroup.rotation.z = Math.sin(elapsed * 16) * 0.14 * state.wobbleFactor;
          u.bodyGroup.scale.set(u.scaleXZ, u.scaleY, u.scaleXZ);
          return;
        }

        if (state.trainPhase !== 'departing') {
          if (u.jumpY > 0.001) {
            u.jumpY = THREE.MathUtils.lerp(u.jumpY, 0, dt * 11);
          } else {
            u.jumpY = 0;
          }
        }
        u.bodyGroup.position.y = u.jumpY;

        if (u.wobbleAmp > 0.002) {
          u.wobblePhase += dt * 24;
          const wave = Math.sin(u.wobblePhase) * u.wobbleAmp;
          const sy = 1 + wave * 0.38;
          const sxz = 1 / Math.sqrt(Math.max(0.5, sy));
          u.bodyGroup.scale.set(sxz, sy, sxz);
          u.bodyGroup.rotation.z = Math.cos(u.wobblePhase * 0.8) * u.wobbleAmp * 0.22;

          if (u.leftArm && u.rightArm) {
            u.leftArm.rotation.z = -u.wobbleAmp * 0.75;
            u.rightArm.rotation.z = u.wobbleAmp * 0.75;
          }

          u.wobbleAmp *= Math.pow(0.06, dt);
        } else {
          const breath = Math.sin(elapsed * 2.8 + u.wobblePhase) * 0.028 * state.wobbleFactor;
          u.bodyGroup.scale.set(1 - breath * 0.5, 1 + breath, 1 - breath * 0.5);
          u.bodyGroup.rotation.z = 0;
        }

        if (u.miniFigures) {
          u.miniFigures.forEach((mf, idx) => {
            const mu = mf.userData;
            if (mu.eyesGroup) {
              const bCycle = (elapsed + mu.blinkOffset) % 3.8;
              mu.eyesGroup.scale.y = (bCycle > 3.65) ? 0.1 : 1.0;
            }
            if (mu.mouthMesh) {
              if (mu.mouthOpen > 0.01) {
                mu.mouthOpen = THREE.MathUtils.lerp(mu.mouthOpen, 0, dt * 9.5);
                mu.mouthMesh.scale.set(
                  0.55 + mu.mouthOpen * 0.6,
                  0.35 + mu.mouthOpen * 1.55,
                  1.0 + mu.mouthOpen * 0.35
                );
              } else {
                mu.mouthOpen = 0;
                mu.mouthMesh.scale.set(0.55, 0.35, 1.0);
              }
            }

            if (mu.jumpY > 0.001) {
              mu.jumpY = THREE.MathUtils.lerp(mu.jumpY, 0, dt * 14);
            } else {
              mu.jumpY = 0;
            }
            mf.position.y = mu.jumpY;

            if (mu.wobbleAmp > 0.002) {
              mu.wobblePhase += dt * 28;
              const mWave = Math.sin(mu.wobblePhase) * mu.wobbleAmp;
              const mSy = 1 + mWave * 0.42;
              const mSxz = 1 / Math.sqrt(Math.max(0.5, mSy));
              mf.scale.set(mSxz, mSy, mSxz);
              mu.wobbleAmp *= Math.pow(0.04, dt);
            } else {
              const mBreath = Math.sin(elapsed * 3.5 + idx * 0.9) * 0.03 * state.wobbleFactor;
              mf.scale.set(1 - mBreath * 0.5, 1 + mBreath, 1 - mBreath * 0.5);
            }
          });
        }
      });

      // 3. Animate Steam Puffs
      for (let i = steamParticles.length - 1; i >= 0; i--) {
        const sp = steamParticles[i];
        sp.mesh.position.y += sp.vy;
        sp.mesh.position.x += sp.vx;
        sp.scale += dt * 1.45;
        sp.mesh.scale.setScalar(sp.scale);
        sp.life -= dt * 0.85;
        sp.mesh.material.opacity = Math.max(0, sp.life * 0.85);
        if (sp.life <= 0) {
          scene.remove(sp.mesh);
          steamParticles.splice(i, 1);
        }
      }

      // 3b. Animate Singing Star/Note Burst Particles
      for (let i = noteBurstParticles.length - 1; i >= 0; i--) {
        const np = noteBurstParticles[i];
        np.mesh.position.x += np.vx;
        np.mesh.position.y += np.vy;
        np.mesh.position.z += np.vz;
        np.mesh.rotation.y += np.rotSpeed;
        np.mesh.rotation.x += np.rotSpeed * 0.8;
        np.life -= dt * 1.65;
        np.mesh.scale.setScalar(Math.max(0.01, np.life));
        np.mesh.material.opacity = Math.max(0, np.life);
        if (np.life <= 0) {
          scene.remove(np.mesh);
          noteBurstParticles.splice(i, 1);
        }
      }

      // 3c. Animate 3D Sound Wave Ripple Rings
      for (let i = soundRippleRings.length - 1; i >= 0; i--) {
        const rp = soundRippleRings[i];
        rp.scale += dt * 2.8;
        rp.life -= dt * 1.85;
        rp.mesh.scale.setScalar(rp.scale);
        rp.mesh.material.opacity = Math.max(0, rp.life * 0.75);
        if (rp.life <= 0) {
          scene.remove(rp.mesh);
          soundRippleRings.splice(i, 1);
        }
      }

      // 4. Project Persistent 3D World Labels
      persistentWorldLabels.forEach(item => {
        const worldPos = item.localPos.clone();
        if (item.followTrain) {
          worldPos.x += trainGroup.position.x;
        }
        const v = worldPos.project(camera);
        if (v.z > 1 || worldPos.x < -14 || worldPos.x > 14) {
          item.el.style.opacity = '0';
        } else {
          const x = (v.x * 0.5 + 0.5) * window.innerWidth;
          const y = (-(v.y * 0.5) + 0.5) * window.innerHeight;
          item.el.style.left = `${x}px`;
          item.el.style.top = `${y}px`;
          item.el.style.opacity = '1';
        }
      });

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function startApp() {
      if (window.__rhythmTrainInitialized) return;
      window.__rhythmTrainInitialized = true;
      updateScoreAndStats();
      animate();
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      startApp();
    } else {
      window.addEventListener('DOMContentLoaded', startApp);
      window.addEventListener('load', startApp);
    }
  </script>
</body>
</html>
